<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#101710">
  <title>Arkham TV</title>
  <link rel="icon" href="arkhamtv-mark.svg">
  <link rel="stylesheet" href="mobile.css">
  <script src="hls.min.js" defer></script>
  <script src="mobile.js" defer></script>
</head>
<body>
  <main class="mobile-app">
    <section class="rotate-view" aria-labelledby="rotate-title">
      <div class="mobile-brand"><img src="arkhamtv-mark.svg" alt=""> Arkham TV</div>
      <svg class="rotate-icon" viewBox="0 0 72 56" aria-hidden="true"><rect x="21" y="7" width="26" height="42" rx="5" transform="rotate(-17 34 28)"/><path d="M31 43l7-2M49 8a17 17 0 0 1 15 17m-7-4 7 6 5-7"/></svg>
      <h1 id="rotate-title" data-en="Rotate your phone to watch TV">Gira el móvil para ver la TV</h1>
      <p id="rotate-status" role="status" data-en="The live stream will open in landscape.">La emisión se abrirá en horizontal.</p>
    </section>
    <div class="landscape-view">
      <section class="mobile-player" aria-label="Arkham TV">
        <video id="video" playsinline></video>
        <div class="player-top">
          <span class="live-badge" data-en="Live">En directo</span>
          <div class="player-actions">
            <button id="guide-toggle" class="guide-toggle" type="button" aria-controls="guide" aria-expanded="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18M3 10h10M3 15h8M3 20h8m4-8 6 4-6 4z"/></svg><span data-en="TV Guide">Guía TV</span>
            </button>
            <button id="mobile-fullscreen" type="button" aria-label="Salir de pantalla completa" data-en-label="Exit full screen">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path class="expand-icon" d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5" hidden/><path class="collapse-icon" d="M4 9h5V4m11 5h-5V4M9 20v-5H4m11 5v-5h5"/></svg>
            </button>
          </div>
        </div>
        <div class="player-center">
          <button id="mobile-play" type="button" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7z"/></svg><span data-en="Play live TV">Reproducir en directo</span></button>
          <p id="player-status" role="status"></p>
        </div>
        <div class="player-now">
          <div class="program"><span id="channel-name"></span><strong id="programme-name"></strong></div>
          <button id="sound-toggle" type="button" hidden><span></span></button>
        </div>
      </section>
      <aside id="guide" aria-labelledby="guide-title" hidden>
        <header class="guide-header"><div><h2 id="guide-title" data-en="TV Guide">Guía TV</h2><p data-en="On now">Ahora en emisión</p></div>
          <button id="guide-close" type="button" aria-label="Cerrar guía" data-en-label="Close guide"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12m0-12L6 18"/></svg></button>
        </header>
        <p id="guide-status" role="status" hidden></p>
        <ul id="channel-list"></ul>
      </aside>
    </div>
  </main>
</body>
</html>
